<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadsAfrica</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <i class="fa-solid fa-bars"></i>
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                    <path d="M16 4L4 10L16 16L28 10L16 4Z" fill="#00A3FF"/>
                    <path d="M4 14L16 20L28 14" stroke="#00A3FF" stroke-width="2"/>
                    <path d="M4 20L16 26L28 20" stroke="#00A3FF" stroke-width="2"/>
                </svg>
                <span>LeadsAfrica</span>
            </div>
            <div class="avatar">
                <img src="https://ui-avatars.com/api/?name=User&background=00A3FF&color=fff&size=40" alt="">
                <div class="online"></div>
            </div>
        </div>

        <!-- Balance Card -->
        <div class="card-balance">
            <div class="bal-row-1">
                <div>
                    <span>Available Balance</span>
                    <h1>₦0.00</h1>
                </div>
                <button>Withdraw</button>
            </div>
            <div class="bal-row-2">
                <div>
                    <span>Total Earned</span>
                    <h2>₦0.00</h2>
                </div>
                <div>
                    <span>Total Withdrawn</span>
                    <h2>₦0.00</h2>
                </div>
            </div>
        </div>

        <!-- Incomplete Account -->
        <div class="card">
            <div class="incomplete">
                <div class="left">
                    <h4>Incomplete Account</h4>
                    <div class="bar"><div class="fill"></div></div>
                    <span>25% Complete</span>
                </div>
                <button class="btn-blue-light">Activate Plan</button>
            </div>
        </div>

        <!-- Affiliate + Daily Tasks -->
        <div class="grid-2">
            <div class="card-sm">
                <div class="icon-circle blue"><i class="fa-solid fa-users"></i></div>
                <div>
                    <p>Affiliate</p>
                    <h3>₦0.00</h3>
                </div>
            </div>
            <div class="card-sm">
                <div class="icon-circle green"><i class="fa-solid fa-clipboard-list"></i></div>
                <div>
                    <p>Daily Tasks</p>
                    <h3>₦0.00</h3>
                </div>
            </div>
        </div>

        <!-- Connect Refer Friends -->
        <div class="card-dark">
            <div class="icon-circle white"><i class="fa-solid fa-share-nodes"></i></div>
            <div>
                <p>Connect</p>
                <h3>Refer Friends</h3>
            </div>
        </div>

        <!-- 3 Buttons -->
        <div class="grid-3">
            <div class="card-sm center">
                <div class="icon-circle blue"><i class="fa-solid fa-clipboard-list"></i></div>
                <p>Daily Tasks</p>
            </div>
            <div class="card-sm center">
                <div class="icon-circle red"><i class="fa-solid fa-bullhorn"></i></div>
                <p>Sponsored</p>
            </div>
            <div class="card-sm center">
                <div class="icon-circle blue"><i class="fa-solid fa-video"></i></div>
                <p>Monetize</p>
            </div>
        </div>

        <!-- Share & Earn -->
        <div class="card">
            <div class="share-row">
                <div class="icon-circle blue"><i class="fa-solid fa-share-nodes"></i></div>
                <h3>Share & Earn</h3>
            </div>
            <p class="muted">Invite your friends and earn commissions from their activities.</p>
        </div>
    </div>
</body>
</html>
